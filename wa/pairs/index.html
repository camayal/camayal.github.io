<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Memoriter</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF7EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memoriter">
<link rel="icon" type="image/png" href="/memoriter/dist/icon-192.png">
<link rel="apple-touch-icon" href="/memoriter/dist/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#FFF7EA;overflow:hidden;
    overscroll-behavior:none;touch-action:none}          /* no pull-to-refresh, no zoom */
  iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="game" title="Memoriter" allow="autoplay; fullscreen"></iframe>
<script>
  // The game lives in the memoriter repo (camayal.info/memoriter/dist/). Settings in the address
  // are passed along, so camayal.info/wa/pairs/?lang=es&set=fruits or ?setup work here too.
  document.getElementById("game").src = "/memoriter/dist/" + location.search;
  // Offline: this page saves itself (sw.js next to it); the game in the iframe saves itself too.
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
